schema_version: 1
title: Current local source and capability gate catalog
diagnostic_only: true
forbidden_actions:
  - modify_source
  - modify_tests
  - modify_gates
  - format_source
  - delete_files
  - write_git_index
gates:
  - id: architecture
    group: architecture
    command: [python, scripts/check-architecture.py]
    capabilities: [activity_framework, service_framework, bind_application_loaded_apk_component_factory]
    required: true
    timeout_sec: 180
  - id: typed-contracts
    group: typed_contract
    command: [python, scripts/check-contracts.py]
    capabilities: [pending_intent_intent_sender, system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: ports-and-dispatchers
    group: typed_contract
    command: [python, scripts/check-ports-dispatchers.py]
    capabilities: [system_service_virtualization, provider_transport]
    required: true
    timeout_sec: 180
  - id: build-environment
    group: gradle_configuration
    command: [python, scripts/check-build-environment.py]
    capabilities: [android_oem_compatibility]
    required: true
    timeout_sec: 120
  - id: baseline-manifest
    group: repository_integrity
    command: [python, tools/baseline_manifest.py]
    capabilities: [android_oem_compatibility]
    required: true
    timeout_sec: 180
  - id: reference-sources
    group: repository_integrity
    command: [python, tools/reference_sources.py, verify]
    capabilities: [android_oem_compatibility]
    required: true
    timeout_sec: 180
  - id: static-android-compile
    group: static_compile
    command: [python, tools/static_android_compile.py]
    capabilities:
      - activity_framework
      - service_framework
      - bind_application_loaded_apk_component_factory
      - pending_intent_intent_sender
      - manifest_package_parser
      - virtual_pms_package_visibility
      - multi_process_process_name_slot
      - provider_transport
      - classloader
      - native_loader_jni_io
      - process_death_recovery
      - package_lifecycle_clear_delete_reinstall
      - system_service_virtualization
    required: true
    timeout_sec: 1800
  - id: gradle-lock-state
    group: dependency
    command: [python, tools/gradle_lock_state.py, verify, --require-clean]
    capabilities: [android_oem_compatibility]
    required: true
    timeout_sec: 180
  - id: sbom
    group: dependency
    command: [python, scripts/generate-sbom.py, --check]
    capabilities: [android_oem_compatibility]
    required: true
    timeout_sec: 180
  - id: guest-boundary
    group: runtime_self_test
    command: [python, scripts/check-guest-boundary.py]
    capabilities: [classloader, multi_process_process_name_slot, native_loader_jni_io]
    required: true
    timeout_sec: 180
  - id: runtime-hardening
    group: runtime_self_test
    command: [python, scripts/check-pre-device-runtime-hardening.py]
    capabilities: [process_death_recovery, bind_application_loaded_apk_component_factory]
    required: true
    timeout_sec: 180
  - id: package-boundaries
    group: package_visibility
    command: [python, scripts/check-package-boundaries.py]
    capabilities: [manifest_package_parser, virtual_pms_package_visibility]
    required: true
    timeout_sec: 180
  - id: package-query-resolve
    group: package_visibility
    command: [python, scripts/check-package-query-resolve.py]
    capabilities: [manifest_package_parser, virtual_pms_package_visibility]
    required: true
    timeout_sec: 180
  - id: virtual-package-state
    group: package_visibility
    command: [python, scripts/check-virtual-package-state.py]
    capabilities: [virtual_pms_package_visibility]
    required: true
    timeout_sec: 180
  - id: package-service-boundary
    group: package_visibility
    command: [python, scripts/check-package-service-boundary.py]
    capabilities: [virtual_pms_package_visibility]
    required: true
    timeout_sec: 180
  - id: package-lifecycle
    group: clear_delete_reinstall
    command: [python, scripts/check-package-lifecycle-transaction.py]
    capabilities: [package_lifecycle_clear_delete_reinstall]
    required: true
    timeout_sec: 180
  - id: apk-revision-binding
    group: clear_delete_reinstall
    command: [python, scripts/check-apk-revision-binding.py]
    capabilities: [package_lifecycle_clear_delete_reinstall]
    required: true
    timeout_sec: 180
  - id: split-install
    group: package_visibility
    command: [python, scripts/check-split-install-sessions.py]
    capabilities: [classloader, package_lifecycle_clear_delete_reinstall]
    required: true
    timeout_sec: 180
  - id: runtime-permissions
    group: runtime_self_test
    command: [python, scripts/check-runtime-permission-workflow.py]
    capabilities: [system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: capability-proxy-broker
    group: architecture
    command: [python, scripts/check-capability-proxy-broker-split.py]
    capabilities: [system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: native-boundary
    group: native_self_test
    command: [python, scripts/check-native-boundary-matrix.py]
    capabilities: [native_loader_jni_io]
    required: true
    timeout_sec: 180
  - id: native-hostile-profile
    group: native_self_test
    command: [python, scripts/check-native-hostile-profile.py]
    capabilities: [native_loader_jni_io]
    required: true
    timeout_sec: 180
  - id: native-abi-companion
    group: native_self_test
    command: [python, scripts/check-native-abi-companion.py]
    capabilities: [native_loader_jni_io]
    required: true
    timeout_sec: 180
  - id: critical-test-ownership
    group: test_ownership
    command: [python, scripts/check-critical-test-ownership.py]
    capabilities: [activity_framework, provider_transport, process_death_recovery, package_lifecycle_clear_delete_reinstall]
    required: true
    timeout_sec: 300

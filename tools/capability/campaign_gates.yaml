      - activity_framework
      - service_framework
      - provider_transport
      - classloader
      - native_loader_jni_io
    required: true
    timeout_sec: 1800
  - id: build-environment
    group: gradle_configuration
    command: [python, scripts/check-build-environment.py]
    capabilities: [android_oem_compatibility]

schema_version: 1
title: T57-R03 local collect-all gate catalog
diagnostic_only: true
forbidden_actions:
  - modify_source
  - modify_tests
  - modify_gates
  - format_source
  - delete_files
  - write_git_index
gates:
  - id: architecture
    group: architecture
    command: [python, scripts/check-architecture.py]
    capabilities: [activity_framework, service_framework]
    required: true
    timeout_sec: 180
  - id: architecture-quality
    group: architecture
    command: [python, scripts/check-m5-t18-architecture-quality.py]
    capabilities: [activity_framework, system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: architecture-decoupling
    group: architecture
    command: [python, scripts/check-m5-t19-architecture-decoupling.py]
    capabilities: [activity_framework, system_service_virtualization]
    required: true
    timeout_sec: 180
    known_issue_ids: [KI-R03-020]
  - id: typed-contract
    group: typed_contract
    command: [python, scripts/check-contracts.py]
    capabilities: [pending_intent_intent_sender, system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: ports-dispatchers
    group: typed_contract
    command: [python, scripts/check-ports-dispatchers.py]
    capabilities: [system_service_virtualization]
    required: true
    timeout_sec: 180
  - id: source-closure-m4
    group: source_closure
    command: [python, scripts/check-m4-t18-source-closure.py]
    capabilities: [virtual_pms_package_visibility, native_loader_jni_io]

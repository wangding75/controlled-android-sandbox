plugins {
    id 'com.android.application' version '8.11.1' apply false
    id 'com.android.library' version '8.11.1' apply false
}

def releaseIdentitySource = file('sandbox-contract/src/main/java/com/warden/controlledsandbox/contract/ControlledReleaseIdentity.java').getText('UTF-8')
def identityString = { String name ->
    def match = releaseIdentitySource =~ /public static final String ${name} = "([^"]+)";/
    if (!match.find()) throw new GradleException("Missing release identity string: ${name}")
    return match.group(1)
}
def identityInt = { String name ->
    def match = releaseIdentitySource =~ /public static final int ${name} = ([0-9]+);/
    if (!match.find()) throw new GradleException("Missing release identity integer: ${name}")
    return Integer.parseInt(match.group(1))
}

ext {
    controlledReleaseTrain = identityString('RELEASE_TRAIN')
    controlledVersionCode = identityInt('VERSION_CODE')
    controlledVersionName = identityString('VERSION_NAME')
    controlledCompanionProtocol = identityInt('COMPANION_PROTOCOL')
    controlledCompileSdk = 36
    controlledTargetSdk = 35
    controlledMinSdk = 26
    controlledBuildTools = '35.0.0'
    controlledNdkVersion = '27.2.12479018'
    controlledCmakeVersion = '3.22.1'
}

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
    configurations.configureEach {
        resolutionStrategy {
            failOnVersionConflict()
            def dynamicMarker = Character.toString((char) 43)
            def floatingRelease = ['late', 'st.release'].join()
            def floatingIntegration = ['late', 'st.integration'].join()
            def changingSuffix = ['-SNAP', 'SHOT'].join()
            eachDependency { details ->
                def version = details.requested.version
                if (version != null && (version.contains(dynamicMarker) || version == floatingRelease || version == floatingIntegration || version.endsWith(changingSuffix))) {
                    throw new GradleException("Dynamic or changing dependency versions are forbidden: ${details.requested}")
                }
            }
        }
    }
}

tasks.register('resolveAndLockAll') {
    group = 'verification'
    description = 'Resolve every resolvable project configuration so Gradle writes complete lock state.'
    doLast {
        def resolved = []
        allprojects.sort { it.path }.each { project ->
            project.configurations.findAll { it.canBeResolved }.sort { it.name }.each { configuration ->
                configuration.incoming.resolutionResult.allComponents
                resolved << "${project.path}:${configuration.name}"
            }
        }
        if (resolved.isEmpty()) throw new GradleException('No resolvable configurations were found')
        println "RESOLVED_LOCK_CONFIGURATIONS=${resolved.size()}"
        resolved.each { println "LOCKED_CONFIGURATION=${it}" }
    }
}

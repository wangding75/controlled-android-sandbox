plugins { id 'com.android.dynamic-feature' }

apply from: rootProject.file('gradle/release-signing.gradle')

android {
    namespace = 'com.warden.controlledsandbox.fixture.split.feature'
    compileSdk = rootProject.ext.controlledCompileSdk
    buildToolsVersion rootProject.ext.controlledBuildTools

    defaultConfig {
        minSdk = rootProject.ext.controlledMinSdk
        targetSdk = rootProject.ext.controlledTargetSdk
        // Keep every APK in a base+feature session on the revision selected by the
        // P1-13 runner.  An old feature manifest must never be paired with a rebuilt base.
        versionCode = (findProperty('p113VersionCode') ?: 1).toInteger()
        versionName = "${findProperty('p113VersionName') ?: '1.0-split'}"
    }

    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':fixture-split-base') }

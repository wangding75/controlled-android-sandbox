plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free domain self-tests.'
    classpath = sourceSets.testHarness.runtimeClasspath
    mainClass = 'com.warden.controlledsandbox.domain.SelfTest'
}

sourceSets {
    testHarness {
        java.srcDir 'src/testHarness/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

check.dependsOn selfTest

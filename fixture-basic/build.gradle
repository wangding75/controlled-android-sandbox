plugins { id 'com.android.application' }

android {
    namespace 'com.warden.controlledsandbox.fixture'
    compileSdk rootProject.ext.controlledCompileSdk
    buildToolsVersion rootProject.ext.controlledBuildTools
    ndkVersion rootProject.ext.controlledNdkVersion

    defaultConfig {
        applicationId 'com.warden.controlledsandbox.fixture'
        minSdk rootProject.ext.controlledMinSdk
        targetSdk rootProject.ext.controlledTargetSdk
        versionCode 1
        versionName '1.0-fixture'
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    buildTypes { release { minifyEnabled false } }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version rootProject.ext.controlledCmakeVersion
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

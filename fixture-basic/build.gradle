plugins { id 'com.android.application' }

android {
    namespace 'com.warden.controlledsandbox.fixture'
    compileSdk 36
    defaultConfig {
        applicationId 'com.warden.controlledsandbox.fixture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-fixture'
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

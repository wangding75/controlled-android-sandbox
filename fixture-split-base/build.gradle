plugins { id 'com.android.application' }

apply from: rootProject.file('gradle/release-signing.gradle')

android {
    namespace = 'com.warden.controlledsandbox.fixture.split'
    compileSdk = rootProject.ext.controlledCompileSdk
    buildToolsVersion rootProject.ext.controlledBuildTools

    defaultConfig {
        applicationId 'com.warden.controlledsandbox.fixture.split'
        minSdk = rootProject.ext.controlledMinSdk
        targetSdk = rootProject.ext.controlledTargetSdk
        // P1-13 rebuilds the same base + feature split set at two revisions.  The
        // default keeps the ordinary fixture stable; the verification runner passes
        // -Pp113VersionCode for the update/rollback witnesses.
        versionCode = (findProperty('p113VersionCode') ?: 1).toInteger()
        versionName = "${findProperty('p113VersionName') ?: '1.0-split'}"
    }

    dynamicFeatures = [':fixtureSplitFeature']
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Source gates

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locally-executable-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          check-latest: false
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/verification-metadata.xml
            gradle/reviewed-dependency-coordinates.json
      - name: Verify source supply-chain policy
        run: python3 scripts/check-supply-chain-governance.py
      - name: Generate and verify Gradle dependency lock state
        run: |
          ./gradlew --no-daemon --dependency-verification=strict resolveAndLockAll --write-locks
          python3 tools/gradle_lock_state.py verify --require-clean
      - name: Verify Gradle dependency supply chain
        run: ./gradlew --no-daemon --dependency-verification=strict help
      - name: Verify current source architecture and contracts
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/check-contracts.py
          python3 scripts/check-build-environment.py
          python3 tools/baseline_manifest.py
          python3 tools/reference_sources.py verify
          python3 tools/static_android_compile.py

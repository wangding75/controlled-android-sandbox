name: Source gates

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locally-executable-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - name: Verify source, contracts, host runtimes and native boundaries
        run: ./scripts/verify-all.sh | tee verification/ci-source-gates.txt
      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-gates-${{ github.run_id }}
          path: verification/ci-source-gates.txt
          if-no-files-found: warn

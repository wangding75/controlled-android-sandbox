name: Source gates

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locally-executable-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          check-latest: false
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/verification-metadata.xml
            gradle/reviewed-dependency-coordinates.json
      - name: Verify source supply-chain policy
        run: python3 scripts/check-m5-t19-1-u-supply-chain-governance.py
      - name: Verify Gradle dependency supply chain
        run: ./gradlew --no-daemon --dependency-verification=strict help
      - name: Verify source, contracts, host runtimes and native boundaries
        run: ./scripts/verify-all.sh | tee verification/ci-source-gates.txt
      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-gates-${{ github.run_id }}
          path: verification/ci-source-gates.txt
          if-no-files-found: warn
          retention-days: 14

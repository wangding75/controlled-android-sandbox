schema_version: 1
campaign: T57-R03-01
title: Controlled Android Sandbox Capability Registry
maturity_model:
  level_1: RD_BASELINE
  level_2: ANDROID_MATRIX
  level_3: OEM_COMMERCIAL_MATRIX
status_enum:
  - PASS
  - PARTIAL
  - GAP
  - UNVERIFIED
  - BLOCKED_ENV
  - NOT_APPLICABLE
  - EXPECTED
  - NOT_PROVEN
rules:
  - RD测试/API32 PASS only updates rd_api32_status.
  - API33-36 must stay UNVERIFIED until those environments are executed.
  - OEM PASS requires an OEM matrix, not a single historical Xiaomi or MuMu run.
  - commercial_app_status requires named commercial-app evidence.
  - va_pro_equivalent remains NOT_PROVEN until ANDROID_MATRIX and OEM_COMMERCIAL_MATRIX complete.
  - Native hostile/direct-syscall/raw-SVC/custom-loader is not PASS.
  - compileSdk/targetSdk must not be treated as API matrix evidence.

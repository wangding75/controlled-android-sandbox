schema_version: 1
campaign: T57-R03-P0A-01
title: CAS Native boundary matrix
security_statement: >
  PLT/GOT and libc syscall() mediation prove TRUSTED_COMPAT only.
  They do not prove ISOLATED_HOSTILE enforcement.
modes:
  TRUSTED_COMPAT: compatibility interception for ordinary native apps
  ISOLATED_HOSTILE: requires a provable kernel/supervisor/process-authority boundary
status_enum:
  - INTERCEPTED
  - PARTIAL
  - NOT_INTERCEPTED
  - NOT_APPLICABLE
  - UNKNOWN
bypass_risk_enum:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

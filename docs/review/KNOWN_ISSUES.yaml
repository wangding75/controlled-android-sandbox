      the Android bind edge used only BIND_AUTO_CREATE. MuMu's lowmemorykiller then killed the
      large Guest or Broker during lookup/launch even with substantial free device memory;
      the resulting DeadObject/LAUNCH_GATE_FAILED path was a CAS generic process-lifetime
      owner defect, not evidence of Quark or SX/UI incompatibility. The implementation now
      keeps explicit BIND_AUTO_CREATE|BIND_IMPORTANT|BIND_ABOVE_CLIENT edges for the Broker,
      Guest and long-lived authority clients and primes the RuntimeClient owner before package
      lookup, matching the NBB/VA live virtual ProcessRecord ownership boundary. Quark user0/
      user1, DingTalk user0/user1 and Hongguo user0/user1 then passed 300/300 final-code launch
      rows with no retry, sleep or deadline extension; Fanqie user0 passed 4 rows before the
      continuation cutoff. Status remains RECORDED because Fanqie is incomplete (user0 has 46
      missing rows and user1 has 50 missing rows); full matrix validation is still required
      before this issue or C4-R03 can be closed.


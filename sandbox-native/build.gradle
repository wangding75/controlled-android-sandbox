plugins { id 'com.android.library' }

android {
    namespace 'com.warden.controlledsandbox.nativebridge'
    compileSdk rootProject.ext.controlledCompileSdk
    buildToolsVersion rootProject.ext.controlledBuildTools
    ndkVersion rootProject.ext.controlledNdkVersion

    defaultConfig {
        minSdk rootProject.ext.controlledMinSdk
        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' }
        }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version rootProject.ext.controlledCmakeVersion
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

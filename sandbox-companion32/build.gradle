plugins { id 'com.android.application' }

apply from: rootProject.file('gradle/release-signing.gradle')

android {
    namespace 'com.warden.controlledsandbox.companion32'
    compileSdk rootProject.ext.controlledCompileSdk
    buildToolsVersion rootProject.ext.controlledBuildTools
    ndkVersion rootProject.ext.controlledNdkVersion

    defaultConfig {
        applicationId 'com.warden.controlledsandbox.companion32'
        minSdk rootProject.ext.controlledMinSdk
        targetSdk rootProject.ext.controlledTargetSdk
        versionCode rootProject.ext.controlledVersionCode
        versionName rootProject.ext.controlledVersionName
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' } }
        ndk { abiFilters 'armeabi-v7a', 'x86' }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version rootProject.ext.controlledCmakeVersion
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':sandbox-domain')
    implementation project(':sandbox-contract')
    implementation project(':sandbox-runtime')
}
